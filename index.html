<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disney Xmas'26</title>
<meta name="application-name" content="Disney Xmas'26">
<meta name="apple-mobile-web-app-title" content="Disney Xmas'26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2443c9">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a family holiday — playful, warm, a bit of sparkle, still quick to read in a queue.
   IDEA: the fold-out park guide map you grab at the gate, crossed with a fireworks night.
   PICTURE: a royal-blue night sky with an original storybook castle and bursting fireworks.
   COLOUR and TYPE: royal blue sky, candy pink, gold sparkle, rainbow category colours; Fredoka titles, Nunito text.
   LAYOUT: sticky sky header with tabs + day pills; one column of big-time cards; thumb-friendly buttons bottom right. */
:root{color-scheme:light dark;
  --sky:#2443c9;--sky2:#3a5cf0;--pink:#ff4f9a;--gold:#ffc53d;
  --fd:"Fredoka","Nunito",system-ui,sans-serif;--fb:"Nunito",system-ui,sans-serif;
  --bg:light-dark(#fff8ef,#0f1430);--card:light-dark(#ffffff,#1a2150);--ink:light-dark(#1d1a3a,#f4f1ff);
  --muted:light-dark(#6c6788,#b4b0d6);--line:light-dark(#efe6f5,#2c3570);--soft:light-dark(#fff0f6,#2a2050);
  --c-travel:#3d5afe;--c-food:#ff7a1a;--c-ride:#e8336f;--c-show:#8b3ffc;--c-rest:#10a99b;--c-move:#1f9bea;--c-split:#e0a400;--c-fun:#ff4f9a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{overscroll-behavior-y:none;overflow-x:clip}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3,.f{font-family:var(--fd)}
button{font:inherit;color:inherit}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#3a5cf0,#1a2c95 70%);display:grid;place-items:center;transition:opacity .7s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .in{text-align:center;color:#fff;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
#splash svg{width:min(60vw,240px);height:auto}
#splash .w{font-family:var(--fd);font-size:34px;font-weight:700;margin-top:8px}
#splash .s{opacity:.85;font-weight:600}
#splash .go{display:inline-block;margin-top:22px;background:var(--gold);color:#1d1a3a;font-weight:800;border-radius:999px;padding:12px 22px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
/* hero */
.hero{position:relative;background:linear-gradient(180deg,#1a2c95,var(--sky) 60%,var(--sky2));color:#fff;overflow:hidden;padding:14px 16px 14px;text-align:center}
.hero .scene{display:block;width:min(560px,100%);height:auto;margin:0 auto}
.hero h1{font-size:clamp(32px,8vw,46px);line-height:1.05;margin:2px 0 0;text-wrap:balance;text-shadow:0 3px 0 rgba(10,20,90,.35)}
.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 3.4s ease-out infinite}
@keyframes burst{0%{transform:scale(.1);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:scale(1.15);opacity:0}}
/* header */
header{position:sticky;top:0;z-index:5;background:var(--sky2);color:#fff;box-shadow:0 6px 18px rgba(20,30,110,.25);padding-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 12px 0;max-width:680px;margin:0 auto}
.tab{border:2px solid rgba(255,255,255,.55);background:none;color:#fff;font-weight:800;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;min-height:40px}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1d1a3a}
.days{display:flex;justify-content:safe center;gap:4px;overflow-x:auto;padding:10px 10px 0;max-width:680px;margin:0 auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;position:relative;border:2px solid transparent;color:#fff;border-radius:12px;width:40px;padding:3px 0 4px;cursor:pointer;text-align:center;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,.16) 0 52%,var(--dc) 52% 100%)}
.day small{display:block;font-size:10px;font-weight:800;text-transform:uppercase;opacity:.9;line-height:1.3}
.day b{display:block;font-family:var(--fd);font-size:16px;line-height:1.2;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.day.all{width:44px;background:linear-gradient(rgba(255,255,255,.16) 0 52%,transparent 52%),linear-gradient(90deg,#ff4f9a,#ffc53d,#10a99b,#8b3ffc)}
.day.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.day.on small{color:#1d1a3a}
.day.on{background:linear-gradient(#fff 0 52%,var(--dc) 52% 100%)}
.day.all.on{background:linear-gradient(#fff 0 52%,transparent 52%),linear-gradient(90deg,#ff4f9a,#ffc53d,#10a99b,#8b3ffc)}
.day.on b{color:#fff}
.day.today{border-color:var(--gold);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px 4px rgba(255,197,61,.9)}}
.day,.tab,.chip,.btn,.fab{transition:transform .12s ease}.day:active,.tab:active,.chip:active,.btn:active,.fab:active{transform:scale(.92)}
main{max-width:680px;margin:0 auto;padding:16px 14px 110px}
/* day head */
.dh{border-radius:22px;padding:16px 16px 14px;color:#fff;background:var(--dc);margin-bottom:14px;position:relative;overflow:hidden}
.dh::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.dh small{font-weight:800;text-transform:uppercase;font-size:12px;opacity:.9}
.dh h2{font-size:clamp(26px,6vw,34px);line-height:1.05;margin:2px 0 8px}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700}
.pill.np{padding-left:10px}
.allsep{height:6px}
.note{background:var(--soft);border-radius:16px;padding:11px 14px;font-size:15px;margin:0 0 12px;border:2px dashed color-mix(in srgb,var(--pink) 45%,transparent)}
.note b{color:var(--pink)}
/* events */
.ev{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 0 var(--line),0 6px 16px rgba(40,30,120,.06);border-left:6px solid var(--c)}
.ev.now{outline:3px solid var(--gold);box-shadow:0 0 18px 4px rgba(255,197,61,.55)}
.ev.past{opacity:.55}
.ev.hit{animation:hit 2.4s ease 1}
@keyframes hit{0%,100%{box-shadow:0 0 0 0 rgba(255,79,154,0)}25%{box-shadow:0 0 22px 8px rgba(255,79,154,.7)}}
.time{flex:0 0 66px;font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.1;color:var(--c);white-space:nowrap}
.time small{display:block;font-size:12px;color:var(--muted);font-family:var(--fb);font-weight:800}
.title{font-weight:800;font-size:16.5px;line-height:1.3}
.sub{font-size:14.5px;color:var(--muted);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,#888) 14%,transparent);color:var(--c,#888)}
.tag.mp{--c:#8b3ffc}.tag.sp{--c:#e8336f}.tag.sb{--c:#10a99b}.tag.live{background:var(--gold);color:#1d1a3a}
.av{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--a) center/cover no-repeat;font-family:var(--fd);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nextup{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:11px 14px;margin-bottom:14px;border:3px solid var(--gold)}
.nextup small{display:block;font-size:12px;font-weight:800;color:#c48a00;text-transform:uppercase}
.empty{background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;border:3px dashed var(--line);margin-bottom:10px}
.empty h3{margin:0 0 4px;font-size:22px}
/* countdown */
.cd{background:var(--card);border-radius:22px;padding:16px;text-align:center;margin:0 0 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 6px 18px rgba(40,30,120,.08)}
.cd .l{font-weight:800;margin-bottom:10px}
.cdg{display:flex;justify-content:center;gap:10px}
.cdu b{display:block;font-family:var(--fd);font-size:clamp(30px,9vw,42px);line-height:1;color:#fff;border-radius:14px;padding:10px 0;width:clamp(58px,17vw,76px);background:var(--u)}
.cdu small{font-size:12px;font-weight:800;color:var(--muted)}
.cd .h{font-size:13px;color:var(--muted);margin-top:8px}
/* generic cards */
h2.sec{font-size:22px;margin:24px 0 10px}
.card{background:var(--card);border-radius:18px;padding:13px 15px;margin-bottom:10px;box-shadow:0 2px 0 var(--line)}
.card h3{margin:0 0 4px;font-size:18px}
.card ol{margin:6px 0 0;padding-left:22px;font-style:italic}.card ol li{margin:3px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.card h3+.row{border-top:0}
.row span:first-child{color:var(--muted);font-weight:700;flex:0 0 auto;max-width:45%}
.row span:last-child{text-align:right}
.code{font-family:var(--fd);font-weight:600;letter-spacing:.05em;background:var(--soft);border-radius:8px;padding:1px 8px;white-space:nowrap}
.fam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fm{background:var(--card);border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 2px 0 var(--line)}
.fm .av{width:56px;height:56px;font-size:22px;margin:0 auto 4px;display:grid;border:3px solid var(--a)}
.fm b{display:block;font-size:14px}.fm small{color:var(--muted);font-size:12px}
@media (max-width:380px){.fam{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* shows */
.show{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:linear-gradient(135deg,#2a2a8a,#5b2bb5);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:10px}
.show .t{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--gold);white-space:nowrap;grid-row:span 2}
.show b{font-size:17px}.show span{font-size:14.5px;opacity:.9}
.show .d{grid-column:1/-1;font-size:12px;font-weight:800;text-transform:uppercase;opacity:.75}
/* rides */
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kid{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:0 2px 0 var(--line)}
.kid .av{width:54px;height:54px;font-size:20px;display:grid;margin:0 auto 2px;border:3px solid var(--a)}
.kid b{font-family:var(--fd);font-size:19px}
.step{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:22px;font-weight:800;cursor:pointer}
.step output{font-family:var(--fd);font-size:26px;font-weight:700;min-width:56px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.ride{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:0 2px 0 var(--line)}
.ride .h{flex:0 0 46px;font-family:var(--fd);font-weight:700;font-size:20px;color:var(--c-split);white-space:nowrap}
.ride .n{flex:1}.ride .n b{display:block;font-size:15.5px}.ride .n small{color:var(--muted);font-size:13.5px}
.ok{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.kn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800}
.kn .av{width:22px;height:22px;font-size:10px}
.kn.no{color:var(--muted);text-decoration:line-through;text-decoration-color:#e8336f;text-decoration-thickness:2px}
.kn.no .av{filter:grayscale(1);opacity:.5;position:relative}
/* todo */
.todo{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.todo .bx{flex:0 0 28px;height:28px;border-radius:9px;border:3px solid var(--pink);display:grid;place-items:center;color:#fff;font-weight:800}
.todo.done .bx{background:var(--pink)}
.todo.done .tx{text-decoration:line-through;opacity:.55}
.todo .when{display:block;font-size:13px;font-weight:800;color:var(--c-move)}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:999px;transition:width .4s}
/* floating buttons */
.fabs{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{border:0;cursor:pointer;font-weight:800;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);min-height:48px}
#srchb{background:var(--gold);color:#1d1a3a;padding:0 18px;display:flex;align-items:center;gap:8px}
#totop{width:48px;background:var(--pink);color:#fff;font-size:22px;opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .3s,transform .3s}
#totop.show{opacity:1;transform:none;pointer-events:auto}
#sbox{position:fixed;inset:0;z-index:60;background:rgba(10,14,50,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top)) 12px 12px}
#sbox[hidden]{display:none}
.sb{background:var(--bg);width:100%;max-width:640px;max-height:85vh;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sb .top{display:flex;gap:8px;padding:12px;background:var(--sky2)}
.sb input{flex:1;font:inherit;font-size:16px;border:0;border-radius:14px;padding:11px 14px;background:#fff;color:#1d1a3a}
.sb input:focus{outline:3px solid var(--gold)}
.sb .x{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:0 14px;font-weight:800;cursor:pointer}
#sres{overflow-y:auto;padding:10px 12px 14px}
.sr{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-left:5px solid var(--c)}
.sr small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.sr b{font-size:15px}
.sr mark{background:color-mix(in srgb,var(--gold) 55%,transparent);color:inherit;border-radius:3px}
canvas#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:26px}
.rise{animation:rise .45s ease both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise,.tw,.burst,.day.today,#splash .in,#splash .go{animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="tabs" id="tabs">

<script>
{
const UPDATED="26 Nov 2026";
// Confirmation codes (the public GitHub build empties this object)
const CODES={};
const PH={};
const PEOPLE={K:["Katie","#ff4f9a"],A:["Albert","#3d5afe"],Ja:["Nonna","#8b3ffc"],Js:["Jason","#10a99b"],M:["Mutaz","#1f9bea"],L:["London","#ff7a1a","8"],B:["Bowie","#e0a400","5"]};
const BYNAME={Katie:"K",Albert:"A",Nonna:"Ja",Jason:"Js",Mutaz:"M"};
const ALL=["K","A","Ja","Js","M","L","B"];
const COL={travel:"var(--c-travel)",food:"var(--c-food)",ride:"var(--c-ride)",show:"var(--c-show)",rest:"var(--c-rest)",move:"var(--c-move)",split:"var(--c-split)",fun:"var(--c-fun)"};

// e = [24h time, label, title, sub, type, tags]
const DAYS=[

// sparkle sound
let ac=null;
function sparkle(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime;
  [1568,2093,2637,3136,2349,2794,3520,4186].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=t0+i*.075+Math.random()*.02;
   o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+.7);
   o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.75)})}catch(e){}}

function et(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return{date:g("year")+"-"+g("month")+"-"+g("day"),min:+g("hour")*60+ +g("minute")}}
const toMin=t=>{const[h,m]=t.split(":");return h*60+ +m};
const todayId=()=>{const n=et();return n.date.startsWith("2026-12-")&&DAYS.some(d=>d.id===n.date.slice(8))?n.date.slice(8):null};

function countdown(){
  const ms=Date.UTC(2026,11,18,12,59)-Date.now(); if(ms<=0) return "";
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  const u=(v,l,c)=>`<div class="cdu"><b style="--u:${c}">${v}</b><small>${l}</small></div>`;
  return `<div class="cd" id="cd"><div class="l f">Take-off to Orlando in</div><div class="cdg">${u(d,"days","var(--pink)")}${u(h,"hours","var(--sky2)")}${u(m,"min","#10a99b")}</div><div class="h">Tap for fireworks</div></div>`;
}
function oneDay(d,anim){
  const n=et(), isToday=todayId()===d.id;
  let nowI=-1; if(isToday) d.ev.forEach((e,i)=>{if(toMin(e[0])<=n.min) nowI=i});
  const lk=BYNAME[d.lead];
  let h=`<div class="dh${anim?" rise":""}" id="day-${d.id}" style="--dc:${d.col}"><small>${d.dow} ${d.id} Dec · ${d.kind}</small><h2>${d.title}</h2><div class="meta">${d.lead?`<span class="pill">${av(lk)}Lead: ${d.lead}</span>`:""}<span class="pill np">Orlando time</span></div></div>`;
  if(d.note) h+=`<div class="note">${d.note}</div>`;
  if(isToday&&d.ev[nowI+1]){const nx=d.ev[nowI+1];h+=`<div class="nextup"><div><small>Next up</small><b>${nx[2]}</b></div><b class="f">${nx[1]}</b></div>`}
  if(d.tbd) h+=`<div class="empty"><h3>Jason is planning this one</h3><div class="sub">Universal Park-to-Park + Epic Universe tickets are booked. Rides and dinner coming soon. Uber both ways.</div></div>`;
  h+=d.ev.map((e,i)=>{const cls=isToday?(i===nowI?" now":i<nowI?" past":""):"";const tg=(e[5]||[]).map(tag).join("")+(i===nowI&&isToday?`<span class="tag live">Now</span>`:"");
    return `<div class="ev${anim?" rise":""}${cls}" id="ev-${d.id}-${i}" style="--c:${COL[e[4]]};--d:${Math.min(i,10)*40}ms"><div class="time">${e[1].replace(/ (AM|PM)/,"<small>$1</small>")}</div><div><div class="title">${e[2]}</div>${e[3]?`<div class="sub">${e[3]}</div>`:""}${tg?`<div class="tags">${tg}</div>`:""}</div></div>`}).join("");
  return h;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===view));
  $("#days").style.display=view==="days"?"":"none";
  if(view==="days") renderDays();
  main.innerHTML=({days:dayView,shows:showsView,rides:ridesView,todo:todoView,info:infoView})[view]();
}

// fireworks
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function boom(x,y){const cols=["#ffc53d","#ff4f9a","#7ee8ff","#b78cff","#ffffff","#5cf2b0"];
  for(let b=0;b<5;b++){const bx=x+(Math.random()-.5)*innerWidth*.7,by=y-Math.random()*innerHeight*.35,c=cols[b%cols.length];
   for(let i=0;i<46;i++){const a=i/46*Math.PI*2,s=2+Math.random()*3.5;parts.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,c,dl:b*12})}}
  if(!raf) tick()}
function tick(){cv.width=innerWidth;cv.height=innerHeight;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0);parts.forEach(p=>{if(p.dl>0){p.dl--;return}p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l--;cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.4,0,7);cx.fill()});
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,cv.width,cv.height),0)}

// search
const IDX=[];
DAYS.forEach(d=>d.ev.forEach((e,i)=>IDX.push({k:"ev",d:d.id,i,c:COL[e[4]],t:e[2],s:e[3],w:`${d.dow} ${d.id} Dec · ${e[1]}`})));
SHOWS.forEach(s=>IDX.push({k:"shows",c:"var(--c-show)",t:s[2],s:s[3],w:`Show · ${s[0]} Dec · ${s[1]}`}));
RIDES.forEach(r=>IDX.push({k:"rides",c:"var(--c-ride)",t:r[0],s:r[3],w:`Ride · ${r[2]?r[2]+'" min':"no minimum"}`}));
TODO.forEach(t=>IDX.push({k:"todo",c:"var(--c-move)",t:t[1],s:t[2],w:"To do"}));
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>s.replace(/<[^>]+>/g,"");
function hl2(s,q){const t=esc(strip(s));if(!q)return t;const i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?t:t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length)}
function search(){const q=$("#sq").value.trim();const ql=q.toLowerCase();
  if(q.length<2){$("#sres").innerHTML=`<p class="foot">Try "vegan", "Fantasmic", "shuttle", "38"…</p>`;return}
  const res=IDX.map((x,n)=>({x,n})).filter(({x})=>(x.t+" "+x.s+" "+x.w).toLowerCase().includes(ql)).slice(0,40);
  $("#sres").innerHTML=res.length?res.map(({x,n})=>`<button class="sr" data-n="${n}" style="--c:${x.c}"><small>${esc(x.w)}</small><b>${hl2(x.t,q)}</b>${x.s?`<div class="sub">${hl2(x.s,q)}</div>`:""}</button>`).join(""):`<p class="foot">Nothing found for "${esc(q)}".</p>`}
function openSearch(){$("#sbox").hidden=false;$("#sq").value="";search();setTimeout(()=>$("#sq").focus(),50)}
function closeSearch(){$("#sbox").hidden=true}
$("#srchb").addEventListener("click",()=>{buzz();openSearch()});
$("#sx").addEventListener("click",()=>{buzz();closeSearch()});
$("#sbox").addEventListener("click",e=>{if(e.target.id==="sbox")closeSearch()});
$("#sq").addEventListener("input",search);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSearch()});
$("#sres").addEventListener("click",e=>{const b=e.target.closest(".sr");if(!b)return;buzz();const x=IDX[+b.dataset.n];closeSearch();
  if(x.k==="ev"){view="days";day=x.d;render();const el=document.getElementById(`ev-${x.d}-${x.i}`);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("hit")}}
  else{view=x.k;render();scrollTo({top:$(".hero").offsetHeight,behavior:"smooth"})}
  store.set("view",view);store.set("day",day)});

// events
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;buzz();view=b.dataset.v;store.set("view",view);render();scrollTo({top:$(".hero").offsetHeight,behavior:"smooth"})});
$("#days").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;buzz();day=b.dataset.d;store.set("day",day);render();scrollTo({top:$(".hero").offsetHeight,behavior:"smooth"})});
main.addEventListener("click",e=>{
  const cd=e.target.closest("#cd"); if(cd){buzz();sparkle();if(!calm) boom(innerWidth/2,innerHeight*.55)}
  const k=e.target.closest("[data-k]"); if(k){buzz();kids[k.dataset.k]=Math.max(30,Math.min(60,kids[k.dataset.k]+ +k.dataset.s));store.set("kids",kids);render()}
  const f=e.target.closest("[data-f]"); if(f){buzz();rideF=f.dataset.f;store.set("rideF",rideF);render()}
  const t=e.target.closest("[data-t]"); if(t){buzz();const id=t.dataset.t;done[id]=!done[id];store.set("done",done);render();
    if(done[id]&&TODO.every(x=>done[x[0]])&&!calm){sparkle();boom(innerWidth/2,innerHeight*.6)}}
});
main.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&e.target.dataset.t){e.preventDefault();e.target.click()}});
$("#totop").addEventListener("click",()=>{buzz();scrollTo({top:0,behavior:"smooth"})});
addEventListener("scroll",()=>$("#totop").classList.toggle("show",scrollY>500),{passive:true});
setInterval(()=>{if(view==="days"||view==="todo")render()},60000);

render();
// splash: tap starts the sparkle sound (phones only allow sound after a tap); fades by itself after 6 s
const sp=$("#splash");let gone=false;
function enter(withSound){if(gone)return;gone=true;if(withSound){buzz();sparkle();if(!calm)boom(innerWidth/2,innerHeight*.5)}sp.classList.add("out");setTimeout(()=>sp.remove(),750)}
sp.addEventListener("click",()=>enter(true));
sp.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")enter(true)});
setTimeout(()=>enter(false),6000);
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
</script>
</body>

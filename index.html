<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disney Xmas&#39;26</title>
<meta name="application-name" content="Disney Xmas'26">
<meta name="apple-mobile-web-app-title" content="Disney Xmas'26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2c95">
<link rel="apple-touch-icon" sizes="180x180" href="xmas3-icon-180.png">
<link rel="apple-touch-icon" href="xmas3-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="xmas3-icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a family holiday — playful, warm, a bit of sparkle, still quick to read in a queue.
   IDEA: the fold-out park guide map you grab at the gate, crossed with a fireworks night.
   PICTURE: a royal-blue night sky with an original storybook castle; tap it for a star-warp firework show.
   COLOUR and TYPE: royal blue sky, candy pink, gold sparkle, a colour per day; Fredoka titles, Nunito text.
   LAYOUT: blue from the status bar down; sticky tabs + day pills; one column of cards; glass buttons bottom right. */
:root{color-scheme:light dark;
  --sky:#2443c9;--sky2:#3a5cf0;--deep:#1a2c95;--pink:#ff4f9a;--gold:#ffc53d;
  --fd:"Fredoka","Nunito",system-ui,sans-serif;--fb:"Nunito",system-ui,sans-serif;
  --bg:light-dark(#fff8ef,#0f1430);--card:light-dark(#ffffff,#1a2150);--ink:light-dark(#1d1a3a,#f4f1ff);
  --muted:light-dark(#6c6788,#b4b0d6);--line:light-dark(#efe6f5,#2c3570);--soft:light-dark(#fff0f6,#2a2050);
  --glass:light-dark(rgba(255,255,255,.42),rgba(30,36,90,.45));
  --c-travel:#3d5afe;--c-food:#ff7a1a;--c-ride:#e8336f;--c-show:#8b3ffc;--c-rest:#10a99b;--c-move:#1f9bea;--c-split:#e0a400;--c-fun:#ff4f9a;
  --sat:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--deep);overscroll-behavior-y:none;overflow-x:clip;scroll-padding-top:170px}
body{margin:0;min-height:100vh;background:var(--deep);color:var(--ink);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,.f{font-family:var(--fd)}
button{font:inherit;color:inherit}
#sbar{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--deep);z-index:5}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#1a2c95 radial-gradient(circle at 50% 42%,#3a5cf0,#1a2c95 70%);display:grid;place-items:center;transition:opacity .7s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .in{text-align:center;color:#fff;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
#splash svg{width:min(60vw,240px);height:auto}
#splash .w{font-family:var(--fd);font-size:34px;font-weight:700;margin-top:8px}
#splash .s{opacity:.85;font-weight:600}
#splash .go{display:inline-block;margin-top:22px;background:var(--gold);color:#1d1a3a;font-weight:800;border-radius:999px;padding:12px 22px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
/* hero */
.hero{position:relative;background:linear-gradient(180deg,var(--deep) 0,var(--deep) calc(var(--sat) + 30px),var(--sky) 55%,var(--deep));color:#fff;overflow:hidden;padding:calc(10px + var(--sat)) 16px 14px;text-align:center}
.hero .scene{display:block;width:min(560px,100%);height:auto;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hero h1{font-size:clamp(32px,8vw,46px);line-height:1.05;margin:2px 0 0;text-wrap:balance;text-shadow:0 3px 0 rgba(10,20,90,.35)}
.hero .hint{font-size:12.5px;font-weight:700;opacity:.7;margin-top:4px}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:var(--o);filter:blur(var(--b));animation:snowfall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes snowfall{0%{transform:translate(0,0)}50%{transform:translate(var(--dx),55vh)}100%{transform:translate(0,110vh)}}
.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 3.4s ease-out infinite}
@keyframes burst{0%{transform:scale(.1);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:scale(1.15);opacity:0}}
/* header */
header{position:sticky;top:var(--sat);z-index:5;background:var(--deep);color:#fff;box-shadow:0 6px 18px rgba(20,30,110,.25);padding-bottom:12px}
.tabs{display:flex;justify-content:center;gap:5px;padding:10px 8px 0;max-width:680px;margin:0 auto}
.tab{position:relative;border:2px solid rgba(255,255,255,.55);background:none;color:#fff;font-weight:800;font-size:13.5px;padding:7px 10px;border-radius:999px;cursor:pointer;min-height:40px;white-space:nowrap}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1d1a3a}
.ipills{position:sticky;top:calc(var(--sat) + var(--hh,74px));z-index:4;display:flex;justify-content:center;gap:6px;overflow:visible;padding:10px 12px 10px;max-width:680px;margin:0 auto;scrollbar-width:none;background:transparent}
.ipills::-webkit-scrollbar{display:none}
.ipill{flex:1 1 0;max-width:58px;border:1px solid rgba(255,255,255,.6);background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);font-size:22px;line-height:1;border-radius:999px;padding:8px 0;cursor:pointer;box-shadow:0 3px 10px rgba(20,20,80,.12);min-height:44px}
.ipill:active{transform:scale(.92)}
.days{display:flex;justify-content:center;gap:5px;padding:12px 10px 0;max-width:620px;margin:0 auto}
.day{flex:1 1 0;max-width:62px;position:relative;border:2px solid transparent;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:6px 0 10px;cursor:pointer;text-align:center;overflow:visible;
  box-shadow:inset 0 -5px 0 var(--dc)}
.day small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;opacity:.9;line-height:1.3}
.day b{display:block;font-family:var(--fd);font-size:21px;line-height:1.15}
.day.all{box-shadow:none}
.day.all::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:0 0 12px 12px;background:linear-gradient(90deg,#ff4f9a,#ffc53d,#10a99b,#8b3ffc)}
.day.on{background:rgba(255,255,255,.3);border-color:#fff;box-shadow:inset 0 -6px 0 var(--dc),inset 0 0 10px 2px rgba(255,255,255,.5)}
.day.all.on{box-shadow:inset 0 0 10px 2px rgba(255,255,255,.5)}
.day.today{border-color:#ffd84a;animation:todayGold 2.2s ease-in-out infinite}
@keyframes todayGold{0%,100%{box-shadow:inset 0 -5px 0 var(--dc),0 0 4px 1px rgba(255,210,60,.5)}50%{box-shadow:inset 0 -5px 0 var(--dc),0 0 0 2px #ffd84a,0 0 18px 7px rgba(255,210,60,1)}}
.day,.tab,.chip,.btn,.fab,.g-btn,.opt{transition:transform .12s ease}
.day:active,.tab:active,.chip:active,.btn:active,.fab:active,.g-btn:active,.opt:active{transform:scale(.92)}
.page{background:var(--bg);min-height:100vh}
main{max-width:680px;margin:0 auto;padding:16px 14px 120px}
/* day head */
.dh{border-radius:22px;padding:16px 16px 14px;color:#fff;background:var(--dc);margin-bottom:14px;position:relative;overflow:hidden}
.dh::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.dh small{font-weight:800;text-transform:uppercase;font-size:12px;opacity:.9}
.dh h2{font-size:clamp(26px,6vw,34px);line-height:1.05;margin:2px 0 8px}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700}
.pill.np{padding-left:10px}
.note{background:var(--soft);border-radius:16px;padding:11px 14px;font-size:15px;margin:0 0 12px;border:2px dashed color-mix(in srgb,var(--pink) 45%,transparent)}
.note b{color:var(--pink)}
.ev{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 0 var(--line),0 6px 16px rgba(40,30,120,.06);border-left:6px solid var(--c)}
.ev.now{outline:3px solid var(--gold);box-shadow:0 0 18px 4px rgba(255,197,61,.55)}
.ev.past{opacity:.55}
.ev.hit{animation:hit 2.4s ease 1}
@keyframes hit{0%,100%{box-shadow:0 0 0 0 rgba(255,79,154,0)}25%{box-shadow:0 0 22px 8px rgba(255,79,154,.7)}}
.time{flex:0 0 66px;font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.1;color:var(--c);white-space:nowrap}
.time small{display:block;font-size:12px;color:var(--muted);font-family:var(--fb);font-weight:800}
.title{font-weight:800;font-size:16.5px;line-height:1.3}
.sub{font-size:14.5px;color:var(--muted);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,#888) 14%,transparent);color:var(--c,#888)}
.tag.mp{--c:#8b3ffc}.tag.sp{--c:#e8336f}.tag.sb{--c:#10a99b}.tag.live{background:var(--gold);color:#1d1a3a}
.av{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--a);font-family:var(--fd);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nextup{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:11px 14px;margin-bottom:14px;border:3px solid var(--gold)}
.nextup small{display:block;font-size:12px;font-weight:800;color:#c48a00;text-transform:uppercase}
.empty{background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;border:3px dashed var(--line);margin-bottom:10px}
.empty h3{margin:0 0 4px;font-size:22px}
.allsep{height:8px}
.cd{background:var(--card);border-radius:22px;padding:16px;text-align:center;margin:0 0 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 6px 18px rgba(40,30,120,.08)}
.cd .l{font-weight:800;margin-bottom:10px}
.cd{position:relative;overflow:hidden;isolation:isolate}
.wind{position:absolute;inset:0;z-index:-1;pointer-events:none}
.wind i{position:absolute;left:-40%;height:2px;width:var(--w);border-radius:2px;background:linear-gradient(90deg,transparent,var(--wc),transparent);opacity:.7;animation:gust var(--s) linear infinite;animation-delay:var(--dl)}
@keyframes gust{0%{transform:translateX(0) translateY(0)}50%{transform:translateX(90vw) translateY(-6px)}100%{transform:translateX(180vw) translateY(4px)}}
.wind .pl{position:absolute;left:-60px;top:var(--y);font-size:var(--fs);animation:fly var(--s) linear infinite;animation-delay:var(--dl);opacity:var(--o);transform-origin:center}
@keyframes fly{0%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(60vw,var(--bob)) rotate(calc(var(--r) * -1))}100%{transform:translate(125vw,0) rotate(var(--r))}}
.cdg{display:flex;justify-content:center;align-items:flex-start;gap:10px}
.cdline{height:1px;background:color-mix(in srgb,var(--muted) 35%,transparent);margin:2px 6px 16px}
.colon{font-family:var(--fd);font-weight:700;font-size:clamp(30px,9vw,42px);line-height:1;padding-top:10px;margin:0 -4px;color:var(--sky2);animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.cdu b{display:block;font-family:var(--fd);font-size:clamp(30px,9vw,42px);line-height:1;color:#fff;border-radius:14px;padding:10px 0;width:clamp(58px,17vw,76px);background:var(--u)}
.cdu small{font-size:12px;font-weight:800;color:var(--muted)}
.cd .h{font-size:13px;color:var(--muted);margin-top:8px}
h2.sec{font-size:22px;margin:24px 0 10px}
.card{background:var(--card);border-radius:18px;padding:13px 15px;margin-bottom:10px;box-shadow:0 2px 0 var(--line)}
.card h3{margin:0 0 4px;font-size:18px}
.card ol{margin:6px 0 0;padding-left:22px;font-style:italic}.card ol li{margin:3px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.card h3+.row{border-top:0}
.row span:first-child{color:var(--muted);font-weight:700;flex:0 0 auto;max-width:45%}
.row span:last-child{text-align:right}
.card a{color:var(--c-travel);font-weight:700}
.applinks a{display:block;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--line)}.applinks a:first-child{border-top:0}
.applinks b{display:block;font-size:16px}.applinks small{display:block;color:var(--muted);font-size:13.5px;font-weight:600}.applinks span{color:var(--c-travel);font-weight:800;font-size:14px}
.rl{display:flex;gap:8px;margin-top:8px}.rl a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:14px;border-radius:999px;padding:9px 10px;color:#fff}
.rl .ub{background:#111}.rl .ly{background:#ff00bf}
.sos{display:block;text-align:center;background:#e8336f;color:#fff;font-weight:800;font-size:17px;text-decoration:none;border-radius:18px;padding:14px;margin:4px 0 10px}
.code{font-family:var(--fd);font-weight:600;letter-spacing:.05em;background:var(--soft);border-radius:8px;padding:1px 8px;white-space:nowrap}
.fam{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.fam .fm{flex:0 0 calc((100% - 24px)/4)}
.fm{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;box-shadow:0 2px 0 var(--line),0 0 0 3px var(--a) inset;background:var(--a)}
.fm .av{position:absolute;inset:0;width:100%;height:100%;border-radius:0;font-size:46px;display:grid}
.fm .av img,.kid .av img{-webkit-mask-image:radial-gradient(ellipse 60% 56% at 50% 42%,#000 48%,rgba(0,0,0,.25) 78%,transparent 100%);mask-image:radial-gradient(ellipse 60% 56% at 50% 42%,#000 48%,rgba(0,0,0,.25) 78%,transparent 100%)}
.ph-nm{position:absolute;left:0;right:0;bottom:0;padding:22px 6px 8px;background:linear-gradient(transparent,rgba(10,10,40,.78));color:#fff;text-align:center;line-height:1.15}
.ph-nm b{display:block;font-family:var(--fd);font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.6)}.age{position:absolute;top:7px;right:7px;z-index:1;background:rgba(10,10,40,.55);color:#fff;font:700 12px var(--fd);border-radius:999px;padding:2px 8px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.kid .ph{overflow:hidden}
.av img[src$="mutaz.jpg"]{scale:1.3;translate:-6.5% -7.6%}
.av img[src$="nonna.jpg"]{scale:1.3;translate:15.6% 0}
.fm .av img[src$="mutaz.jpg"]{translate:-8.7% -7.6%}
.fm .av img[src$="nonna.jpg"]{translate:20.8% 0}
.zz{position:fixed;z-index:1005;font-family:var(--fd);font-weight:700;color:#2443c9;text-shadow:0 0 3px #fff,0 0 6px #fff;pointer-events:none;animation:zz 2.2s ease-out forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.3)}}
.tci,.tsi{position:relative;overflow:hidden}.tci img,.tsi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tci .bd{position:absolute;right:3px;bottom:2px;z-index:1;font-size:17px;font-style:normal;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pimg{flex:0 0 52px;height:52px;border-radius:12px;object-fit:cover;background:var(--soft)}
@media (max-width:380px){.fam .fm{flex-basis:calc((100% - 16px)/3)}}
.show{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:linear-gradient(135deg,#2a2a8a,#5b2bb5);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:10px}
.show .t{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--gold);white-space:nowrap;grid-row:span 2}
.show b{font-size:17px}.show span{font-size:14.5px;opacity:.9}
.show{position:relative;overflow:hidden}.show .em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:54px;opacity:.9;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.show b,.show span{padding-right:58px}
.dsep{height:1px;background:color-mix(in srgb,var(--muted) 35%,transparent);margin:16px 6px}
.show{cursor:pointer}
.show .d{grid-column:1/-1;font-size:12px;font-weight:800;text-transform:uppercase;opacity:.75}
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kid{background:var(--card);border-radius:18px;overflow:hidden;text-align:center;border:2px solid color-mix(in srgb,var(--a) 35%,transparent);box-shadow:0 2px 0 var(--line);padding-bottom:10px}
.kid .ph{position:relative;aspect-ratio:1}
.kid .av{position:absolute;inset:0;width:100%;height:100%;border-radius:0;font-size:46px;display:grid}
.kid .ph-nm b{font-size:21px}
.step{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:22px;font-weight:800;cursor:pointer}
.step output{font-family:var(--fd);font-size:26px;font-weight:700;min-width:56px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.ride{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:0 2px 0 var(--line)}
.art{flex:0 0 50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ride{cursor:pointer}
.ride .h{flex:none;font-family:var(--fd);font-weight:700;font-size:18px;color:var(--c-split);white-space:nowrap;text-align:right;min-width:40px}
.ride .n{flex:1}.ride .n b{display:block;font-size:15.5px}.ride .n small{color:var(--muted);font-size:13.5px}
.ok{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;align-items:flex-end;font-family:var(--fd);font-weight:700;font-size:15px}
.ok span{color:var(--a)}
.ok{min-width:62px}.ok .none{color:var(--muted)}
.todo{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.todo .bx{flex:0 0 28px;height:28px;border-radius:9px;border:3px solid var(--pink);display:grid;place-items:center;color:#fff;font-weight:800}
.todo.done .bx{background:var(--pink)}
.todo.done .tx{text-decoration:line-through;opacity:.55}
.todo .when{display:block;font-size:13px;font-weight:800;color:var(--c-move)}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:999px;transition:width .4s}
/* map */
#map{position:relative;z-index:0;isolation:isolate;height:min(58vh,460px);border-radius:20px;overflow:hidden;background:var(--soft);margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
#map .mapmsg{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:20px}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.mk span{transform:rotate(45deg);color:#fff;font:800 13px var(--fd)}
.place{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:0 2px 0 var(--line);cursor:pointer}

        g.globalAlpha=.85*f.m;g.fillStyle="#fff";g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill()});
      rip.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy=p.vy*.95+.04;p.l--;g.globalAlpha=Math.min(1,p.l/30);g.fillStyle="#fff";g.strokeStyle="rgba(90,120,210,.55)";g.lineWidth=1;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.stroke()});
      rip=rip.filter(p=>p.l>0)}
    requestAnimationFrame(loop)};requestAnimationFrame(loop)}
